name: foxyvpn
description: "FoxyVPN for Windows - unofficial Firefox VPN client (Flutter port)."
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.2.0
  http2: ^2.3.0
  crypto: ^3.0.3
  shared_preferences: ^2.2.0
  flutter_secure_storage: ^9.2.0
  window_manager: ^0.4.0
  path_provider: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    # Bundled so AppVersion can read `version:` at runtime: one source of
    # truth for the exe metadata, the About screen and the update check.
    - pubspec.yaml

  # Vazirmatn v33.003, SIL Open Font License 1.1 — assets/fonts/OFL.txt.
  # Downloaded from https://github.com/rastikerdar/vazirmatn
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
          weight: 400
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
        - asset: assets/fonts/Vazirmatn-ExtraBold.ttf
          weight: 800
