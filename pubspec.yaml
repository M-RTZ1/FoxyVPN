name: fluttewind
description: "FoxyVPN for Windows - unofficial Firefox VPN client (Flutter port)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.2.0
  http2: ^2.3.0
  crypto: ^3.0.3
  shared_preferences: ^2.2.0
  flutter_secure_storage: ^9.2.0
  window_manager: ^0.4.0
  path_provider: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
